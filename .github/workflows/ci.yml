name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build · unit & workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - run: dotnet restore OrderFlow.sln
      - run: dotnet build OrderFlow.sln -c Release --no-restore

      - name: Vulnerable package audit
        run: |
          dotnet list OrderFlow.sln package --vulnerable --include-transitive | tee audit.txt
          ! grep -q "has the following vulnerable packages" audit.txt

      - name: Unit + in-process workflow tests
        run: dotnet test tests/OrderFlow.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: tests/**/TestResults/*.trx

  end-to-end:
    name: End-to-end (Aspire · RabbitMQ · SQL Server)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - run: dotnet build tests/OrderFlow.EndToEndTests -c Release

      # Starts the whole AppHost (SQL Server + RabbitMQ containers and all services) and
      # drives real orders through the YARP gateway.
      - name: End-to-end tests
        run: dotnet test tests/OrderFlow.EndToEndTests -c Release --no-build --logger "trx;LogFileName=e2e.trx" --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: tests/**/TestResults/*.trx
